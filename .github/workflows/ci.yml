name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit suite only. The integration tests self-skip without DATABASE_URL, so
  # this proves the package is usable on a machine with no database.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  # The suite that actually matters. This library is one SQL statement, and a
  # regex over that statement cannot tell you whether it works — only a real
  # Postgres racing real claimants can.
  integration:
    runs-on: ubuntu-latest
    name: integration (postgres ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
